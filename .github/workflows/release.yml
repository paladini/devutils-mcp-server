name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # GH Packages only — does not run the npmjs job.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    # Unchanged npmjs path; tags only (never workflow_dispatch).
    if: github.event_name == 'push'
    name: Publish npm package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify trusted publishing prerequisites
        shell: bash
        run: |
          node --version
          npm --version
          npm_version="$(npm --version)"
          node -e "const [major, minor] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && minor < 5)) process.exit(1)" "$npm_version"
          npm install -g npm@latest

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"

          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match package version $version." >&2
            exit 1
          fi

          {
            echo "name=$name"
            echo "version=$version"
            if [[ "$version" == *-* ]]; then echo "dist_tag=next"; else echo "dist_tag=latest"; fi
          } >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run

      - name: Check npm version
        id: npm
        shell: bash
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm.outputs.published == 'false'
        run: npm publish --access public --provenance --tag "${{ steps.package.outputs.dist_tag }}"

  github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@paladini"

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version $version." >&2
            exit 1
          fi
          {
            echo "version=$version"
            if [[ "$version" == *-* ]]; then echo "dist_tag=next"; else echo "dist_tag=latest"; fi
          } >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run build

      - name: Check GitHub Packages version
        id: ghp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if npm view "@paladini/devutils-mcp-server@${{ steps.package.outputs.version }}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Packages as @paladini/devutils-mcp-server
        if: steps.ghp.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm pkg set name=@paladini/devutils-mcp-server
          npm publish --access public --tag "${{ steps.package.outputs.dist_tag }}"
